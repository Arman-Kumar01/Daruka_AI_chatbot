# Render Deployment Configuration
# https://render.com/docs/render-yaml-reference
#
# This deploys the FastAPI backend using Docker.
# The frontend is deployed separately on Vercel.

services:
  - type: web
    name: darukaa-ai-chatbot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render free tier uses ephemeral storage — the RAG index is rebuilt
    # from repo-controlled data/raw/*.json files during Docker build (scripts/ingest.py)
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000         # Render standard port — Render injects this automatically
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: false
      - key: LLM_PROVIDER
        value: auto
      # Set ALLOWED_ORIGINS to your Vercel URL after frontend deployment:
      # - key: ALLOWED_ORIGINS
      #   value: https://darukaa-ai-chatbot.vercel.app
      # Set API keys if you want LLM-powered responses:
      # - key: GEMINI_API_KEY
      #   fromGroup: darukaa-secrets
      # - key: OPENAI_API_KEY
      #   fromGroup: darukaa-secrets
